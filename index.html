<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환경 적성 검사</title>

    <style>
        body{
    font-family: Arial, sans-serif;
    background:#f4f8f9;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    margin:0;
    padding:20px;
        }

        .container{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);

    max-width:700px;
    width:100%;

    margin-bottom:30px;
        }

        h1{
    color:#2c7a7b;
    font-size:clamp(24px, 5vw, 36px);
        }

        p{
            font-size:18px;
            color:#555;
        }

        button{
            background:#2c7a7b;
            color:white;
            border:none;
            padding:15px 30px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            opacity:0.9;
        }

.question-header{
    position:relative;
    height:50px;
    margin-bottom:10px;
}

.question-header h2{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    margin:0;
    line-height:50px;
}

.back-btn{
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);

    background:transparent;
    color:#2c7a7b;
    border:1px solid #2c7a7b;
    padding:4px 10px;
    font-size:14px;
    cursor:pointer;
}

.likert-guide{
    margin-top:15px;
    text-align:center;
    font-size:13px;
    color:#666;
    line-height:1.8;
}
        
.answer-area{
    display:flex;
    flex-direction:column;
    align-items:center;
}
        
        #buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:15px;
}
        
        ul{
    text-align:left;
    display:inline-block;
    margin:0 auto;
    padding-left:25px;
}

li{
    margin:8px 0;
}
        
.progress-bar{
    width:100%;
    height:20px;
    background:#e0e0e0;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#2c7a7b;
    transition:0.3s;
}
        
    </style>
</head>

<body>

<div class="container">
    <h1>🌍 환경 적성 검사</h1>

    <p>
        나에게 가장 적합한 환경공학 분야는?
    </p>

    <p>
        총 30문항<br>
        소요시간 약 3~5분
    </p>

    <button onclick="startTest()">
        검사 시작하기
    </button>
</div>

<script src="questions.js"></script>
<script src="results.js"></script>
<script src="script.js"></script>

</body>
</html>
