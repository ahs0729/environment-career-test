<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환경 적성 검사</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f8f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .container{
            text-align:center;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            max-width:600px;
        }

        h1{
            color:#2c7a7b;
        }

        p{
            font-size:18px;
            color:#555;
        }

        button{
            background:#2c7a7b;
            color:white;
            border:none;
            padding:15px 30px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            opacity:0.9;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🌍 환경 적성 검사</h1>

    <p>
        나에게 가장 적합한 환경공학 분야는?
    </p>

    <p>
        총 30문항<br>
        소요시간 약 3~5분
    </p>

    <button onclick="startTest()">
        검사 시작하기
    </button>
</div>

<script>
function startTest(){
    alert("다음 단계에서 실제 문항 화면을 연결할 예정입니다!");
}
</script>

</body>
</html>
